keys:
  - &igray age1axplnq7uqquh3yu8at679ww20he8vkjp53h8a0pms7paadhy05mqvx5raw
  # Derived from laptop's /etc/ssh/ssh_host_ed25519_key via ssh-to-age. Lets the
  # NixOS-level sops-nix module decrypt at boot, before any user is logged in.
  - &laptop-host age1xjn2ccjfwr79hfa6rnndnwhvmrt5mlr4xy8txgw7l6vzf478reksvlxj07

creation_rules:
  # Host-level secrets: readable by the machine itself, not just the user.
  - path_regex: secrets/laptop\.yaml$
    key_groups:
      - age:
          - *igray
          - *laptop-host
  - path_regex: secrets/.*\.yaml$
    key_groups:
      - age:
          - *igray
